function qmRefreshRow(row, norm, text, color) {
  row.querySelector(".qm-fill").style.width = (clamp(norm, 0, 1) * 100) + "%";
  row.querySelector(".qm-fill").style.background = `linear-gradient(90deg, ${color}55, ${color})`;
  row.querySelector(".qm-value").textContent = text;
}
function updateQuickMenu() {
  const pb = PB(), wrap = spec.parentElement;
  if (!pb.on.get() || ui.menuHidden) { quickMenu.classList.remove("visible"); return; }
  quickMenu.classList.add("visible");
  const rw = wrap.clientWidth, rh = wrap.clientHeight;
  const topH = 0.82;
  const hx = fx(pb.freq.get()) * rw;
  const py = (1 - (pb.lift.get() / 100) * topH * 0.5) * rh;
  const half = (pb.width.get() / 2) / Math.log2(FMAX / FMIN) * rw;
  let mx = hx + half + 10, my = py - 24;
  if (mx + 122 > rw) mx = hx - half - 130;
  mx = clamp(mx, 4, rw - 122);
  my = clamp(my, 4, rh - 86);
  qmAnchor = { x: mx, y: my };
  if (qmOffset) {
    mx = clamp(mx + qmOffset.dx, 0, rw - 122);
    my = clamp(my + qmOffset.dy, 0, rh - 86);
  }
  quickMenu.style.left = mx + "px";
  quickMenu.style.top = my + "px";
  quickMenu.style.borderColor = bandColor() + "88";
  const rm = pb.ratemode.get();
  const rateNorm = rm === 0 ? pb.div.get() / (DIVS.length - 1)
    : rm === 1 ? Math.log(pb.rate.get() / RATE_MIN) / Math.log(RATE_MAX / RATE_MIN) : 0.5;
  const rateText = rm === 0 ? DIVS[pb.div.get()] : rm === 1 ? fmtRate(pb.rate.get()) : midiNoteName;
  qmRefreshRow(qmRate, rateNorm, rateText, bandColor());
  qmRefreshRow(qmDepth, pb.depth.get() / 100, Math.round(pb.depth.get()) + "%", bandColor());
  const gv = pb.gain.get();
  qmRefreshRow(qmGain, (gv + 6) / 12, (gv >= 0 ? "+" : "") + gv.toFixed(1) + " dB", bandColor());
  const bs = clamp(pb.bias.get(), -100, 100);
  qmRefreshRow(qmBias, (bs + 100) / 200, (bs > 0 ? "R" : bs < 0 ? "L" : "C") + " " + Math.abs(Math.round(bs)) + "%", bandColor());
}
function qmDragRow(row, apply, reset) {
  let drag = false;
  const setFrom = e => {
    const r = row.querySelector(".qm-track").getBoundingClientRect();
    apply(clamp((e.clientX - r.left) / r.width, 0, 1));
  };
  row.addEventListener("mousedown", e => { drag = true; setFrom(e); e.stopPropagation(); e.preventDefault(); });
  window.addEventListener("mousemove", e => drag && setFrom(e));
  window.addEventListener("mouseup", () => drag = false);
  // double-click → default (commits via the global mouseup handler)
  if (reset) row.addEventListener("dblclick", e => { reset(); refreshPanels(); e.stopPropagation(); });
}
qmDragRow(qmRate, n => {
  const pb = PB(), rm = pb.ratemode.get();
  if (rm === 0) pb.div.set(Math.round(n * (DIVS.length - 1)));
  else if (rm === 1) pb.rate.set(RATE_MIN * Math.pow(RATE_MAX / RATE_MIN, n));
  hsRate.refresh();
}, () => {
  const pb = PB(), rm = pb.ratemode.get();
  if (rm === 0) pb.div.set(3);            // 1/2
  else if (rm === 1) pb.rate.set(0.5);    // 0.5 Hz
});
qmDragRow(qmDepth, n => { setDepthCoupled(PB(), n * 100); knobDepth.refresh(); knobBias.refresh(); }, () => setDepthCoupled(PB(), 100));
qmDragRow(qmGain, n => { PB().gain.set(-6 + n * 12); }, () => PB().gain.set(0));
qmDragRow(qmBias, n => { setBiasCoupled(PB(), -100 + n * 200); knobBias.refresh(); knobDepth.refresh(); }, () => setBiasCoupled(PB(), 0));

/* ════════════════════════════════════════════════════════════════════
   SCOPE + LOCAL MODULATOR SIM
   (visual stand-in; real per-band telemetry replaces `pan` when the
   "modvals" event starts flowing from the processor)
   ════════════════════════════════════════════════════════════════════ */
const scopeCanvas = document.getElementById("scopeCanvas");
const SCOPE_N = 240;
let scopeBuf = new Float32Array(SCOPE_N);
let envBuf = new Float32Array(SCOPE_N);   // global envelope-follower shape (Env mode)
let envHead = 0, envDecim = 0; const ENV_DECIM = 6;   // longer time window for the env scope
let scopeHead = 0, scopeBand = 0;
let lastModEvent = 0;

let lastScopeVals = 0;
if (EMBEDDED) {
  window.__JUCE__.backend.addEventListener("scopevals", data => {
    try {
      const d = typeof data === "string" ? JSON.parse(data) : data;
      if (!d || !d.bands) return;
      lastScopeVals = performance.now();
      const sel = d.bands[ui.selected] || [], env = d.env || [];
      for (let k = 0; k < sel.length; k++) {
        scopeBuf[scopeHead] = PB().on.get() ? sel[k] : 0;   // already the final pan
        scopeHead = (scopeHead + 1) % SCOPE_N;
        if (++envDecim >= ENV_DECIM) { envDecim = 0; envBuf[envHead] = env[k] || 0; envHead = (envHead + 1) % SCOPE_N; }
      }
    } catch {}
  });
  window.__JUCE__.backend.addEventListener("modvals", data => {
    try {
      const d = typeof data === "string" ? JSON.parse(data) : data;
      if (!d || !d.pans) return;
      lastModEvent = performance.now();
      for (let i = 0; i < 6; i++) ui.bands[i].pan = d.pans[i] || 0;
      if (d.phases) for (let i = 0; i < 6; i++) ui.bands[i].livePhase = d.phases[i];
      if (d.midiNote !== undefined && d.midiNote >= 0) {
        midiFreq = 440 * Math.pow(2, (d.midiNote - 69) / 12);
        const names = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
        midiNoteName = names[d.midiNote % 12] + (Math.floor(d.midiNote / 12) - 1);
      }
    } catch {}
  });
}

function pushScope() {
  if (scopeBand !== ui.selected) { scopeBuf.fill(0); envBuf.fill(0); envHead = 0; scopeBand = ui.selected; }
  if (EMBEDDED && performance.now() - lastScopeVals < 300) return; // real 750 Hz feed active
  scopeBuf[scopeHead] = PB().on.get() ? ui.bands[ui.selected].pan : 0;
  scopeHead = (scopeHead + 1) % SCOPE_N;
  // preview-only fake envelope (decimated for a slower window)
  if (++envDecim >= ENV_DECIM) { envDecim = 0;
    envBuf[envHead] = clamp(0.5 + 0.35 * Math.sin(simClock * 1.7) + 0.15 * Math.sin(simClock * 5.3), 0, 1);
    envHead = (envHead + 1) % SCOPE_N; }
}
function drawScope() {
  const r = scopeCanvas.getBoundingClientRect();
  if (r.width === 0) return;
  const W = Math.round(r.width * DPR), H = Math.round(r.height * DPR);
  if (scopeCanvas.width !== W) { scopeCanvas.width = W; scopeCanvas.height = H; }
  const ctx = scopeCanvas.getContext("2d"), c = bandColor();
  const on = PB().on.get();
  ctx.clearRect(0, 0, W, H);
  ctx.font = `${7.5 * DPR}px 'JetBrains Mono', ui-monospace, monospace`;

  if (PB().mode.get() === 6) {
    // ── ENVELOPE scope: 0 at bottom → 1 at top, filled ──
    ctx.strokeStyle = "#26221F"; ctx.lineWidth = DPR;
    [0.25, 0.5, 0.75].forEach(fy => { ctx.beginPath(); ctx.moveTo(0, fy * H); ctx.lineTo(W, fy * H); ctx.stroke(); });
    ctx.fillStyle = "#403A32"; ctx.fillText("ENV", 3 * DPR, 10 * DPR);
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let i = 0; i < SCOPE_N; i++) {
      const v = clamp(envBuf[(envHead + i) % SCOPE_N], 0, 1);
      ctx.lineTo(i / (SCOPE_N - 1) * W, H - v * (H * 0.92) - 2 * DPR);
    }
    ctx.lineTo(W, H); ctx.closePath();
    ctx.fillStyle = c + (on ? "2e" : "12"); ctx.fill();
    ctx.strokeStyle = c + (on ? "dd" : "55"); ctx.lineWidth = 1.5 * DPR;
    ctx.beginPath();
    for (let i = 0; i < SCOPE_N; i++) {
      const v = clamp(envBuf[(envHead + i) % SCOPE_N], 0, 1);
      const x = i / (SCOPE_N - 1) * W, y = H - v * (H * 0.92) - 2 * DPR;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
    const last = clamp(envBuf[(envHead + SCOPE_N - 1) % SCOPE_N], 0, 1);
    ctx.beginPath(); ctx.arc(W - 3 * DPR, H - last * (H * 0.92) - 2 * DPR, 2.5 * DPR, 0, 7);
    ctx.fillStyle = on ? "#fff" : "#88837a"; ctx.fill();
    return;
  }

  // ── PAN scope: L (top) / centre / R (bottom) ──
  ctx.strokeStyle = "#3e3a35"; ctx.lineWidth = DPR;
  ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
  ctx.strokeStyle = "#26221F";
  [0.12, 0.88].forEach(fy => { ctx.beginPath(); ctx.moveTo(0, fy * H); ctx.lineTo(W, fy * H); ctx.stroke(); });
  ctx.fillStyle = "#403A32";
  ctx.fillText("L", 3 * DPR, 0.12 * H + 3 * DPR);
  ctx.fillText("R", 3 * DPR, 0.88 * H + 3 * DPR);
  ctx.strokeStyle = c + (on ? "dd" : "44"); ctx.lineWidth = 1.5 * DPR;
  ctx.beginPath();
  for (let i = 0; i < SCOPE_N; i++) {
    const v = scopeBuf[(scopeHead + i) % SCOPE_N];
    const x = i / (SCOPE_N - 1) * W;
    const y = H / 2 - v * (H * 0.38);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
  const last = scopeBuf[(scopeHead + SCOPE_N - 1) % SCOPE_N];
  ctx.beginPath(); ctx.arc(W - 3 * DPR, H / 2 - last * H * 0.38, 2.5 * DPR, 0, 7);
  ctx.fillStyle = on ? "#fff" : "#88837a"; ctx.fill();
}

/* local sim (skipped for bands when live telemetry present) */
let simClock = 0, lastT = performance.now();
function simRateHz(i) {
  const pb = P.bands[i], rm = pb.ratemode.get();
  const base = rm === 0 ? DIV_HZ[pb.div.get()] : rm === 1 ? pb.rate.get() : (midiFreq || 220);
  return base * (SPEEDS[P.speed.get()] || 1);
}
function hash(seed) { const s = Math.sin(seed * 127.1) * 43758.5453; return s - Math.floor(s); }
function tickMods(dt) {
  if (EMBEDDED && performance.now() - lastModEvent < 300) return; // real telemetry flowing
  for (let i = 0; i < 6; i++) {
    const pb = P.bands[i], b = ui.bands[i];
    if (!pb.on.get()) { b.pan = 0; continue; }
    const f = Math.min(simRateHz(i), 30); // visual sim caps at 30 Hz (real DSP goes to audio rate)
    b.phi = (b.phi + f * dt) % 1;
    const ph = (b.phi + pb.phase.get() / 360) % 1;
    switch (pb.mode.get()) {
      case 0: b.target = Math.sin(ph * Math.PI * 2); break;
      case 1: b.target = 1 - 4 * Math.abs(ph - 0.5); break;
      case 2: {
        const cell = Math.floor(simClock * f);
        if (cell !== b.lastDeal) { b.lastDeal = cell; b.target = hash(cell * 6 + i + P.seed.get() + b.driftA) * 2 - 1; }
        break;
      }
      case 3: {
        const tt = simClock * f, c0 = Math.floor(tt), fr = tt - c0;
        const a = hash(c0 * 6 + i + P.seed.get() + b.driftA) * 2 - 1;
        const bb = hash((c0 + 1) * 6 + i + P.seed.get() + b.driftA) * 2 - 1;
        const sm = fr * fr * (3 - 2 * fr);
        b.target = a + (bb - a) * sm; break;
      }
      case 4: {
        const s = 10, r = 28, be = 8 / 3, sc = Math.min(0.02, dt * f * 1.2);
        const { x, y, z } = b.lz;
        b.lz.x = x + s * (y - x) * sc;
        b.lz.y = y + (x * (r - z) - y) * sc;
        b.lz.z = z + (x * y - be * z) * sc;
        if (!isFinite(b.lz.x)) b.lz = { x: 0.1, y: 0, z: 0 };
        b.target = clamp(b.lz.x / 18, -1, 1); break;
      }
      case 5: {
        b.target = stepValueAt(b, (simClock * f) + pb.phase.get() / 360); break;
      }
      case 6: { // Env (preview only — real plugin drives this from audio telemetry)
        b.target = Math.sin(simClock * 1.7 + i) * 0.5 + Math.sin(simClock * 5.3) * 0.2; break;
      }
    }
    const mode = pb.mode.get();
    let k;
    if (mode <= 1) k = 1;                          // sine/tri: no slew
    else {
      const inr = pb.inertia.get() / 100, i2 = inr * inr, per = 1 / Math.max(f, 1e-6);
      let slewT;
      if (mode === 2 || mode === 5) slewT = Math.min(0.004 + i2 * 2.0, per / 3.5);
      else if (mode === 3 || mode === 4) slewT = Math.min(2.0, 0.004 + i2 * 2.0);
      else slewT = i2 * 0.10 * per;
      k = 1 - Math.exp(-dt / slewT);
    }
    b.mod += (b.target - b.mod) * k;                       // raw slewed modulator (-1..1)
    const mv = pb.uni.get() ? (b.mod + 1) * 0.5 : b.mod;
    b.pan = clamp(pb.bias.get() / 100 + mv * (pb.depth.get() / 100) * (P.amount.get() / 100), -1, 1);
  }
}

/* ════════════════════════════════════════════════════════════════════
   MAIN LOOP
   ════════════════════════════════════════════════════════════════════ */
let lastFrame = 0, loopCalls = 0, loopErr = null;
let fpsCount = 0, fpsLastTs = 0;
function loop(ts) {
  loopCalls++;
  requestAnimationFrame(loop);
  if (ts - lastFrame < 15) return;      // ~60 fps cap — matches 60 Hz mod telemetry (smooth fast pans)
  lastFrame = ts;
  fpsCount++;
  if (ts - fpsLastTs > 1000) {
    const el = document.getElementById("fpsInfo");
    if (el) el.textContent = fpsCount + " fps";
    fpsCount = 0; fpsLastTs = ts;
  }
  const now = performance.now(), dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now; simClock += dt;
  applyBandDrag();
  tickAnalyzer(simClock);
  tickMods(dt);
  pushScope();
  try {
    drawSpectrum(simClock);
    drawScope();
    updateQuickMenu();
    if (PB().mode.get() === 5) drawSteps();
  } catch (e) { loopErr = e.message + " | " + (e.stack || "").split("\n")[1]; }
}

/* shell zoom: scale the fixed 900×560 layout to fill the window */
const shellEl = document.getElementById("pluginShell");
function fitShell() {
  // documentElement.clientWidth is reliable in every WebView backend
  // (window.innerWidth can be stale in some embedded contexts).
  const vw = document.documentElement.clientWidth;
  const vh = document.documentElement.clientHeight;
  const scale = (vw > 0 && vh > 0) ? Math.min(vw / 900, vh / 560) : 1;  // pre-layout guard
  shellEl.style.zoom = scale;          // kit pattern: crisp canvases, no bitmap upscale
  sizeSpectrum();
  gridCache = null;                     // grid depends on canvas size
}
window.addEventListener("load", fitShell);
requestAnimationFrame(fitShell);        // re-fit once real layout metrics exist
window.addEventListener("resize", fitShell);

fitShell();
refreshPanels();

/* Robust animation kick: some embedded WebViews drop rAF callbacks queued
   during module evaluation — arm from a macrotask and from the load event,
   idempotently. */
let loopStarted = false;
function kickLoop() {
  if (loopStarted) return;
  loopStarted = true;
  lastT = performance.now();
  requestAnimationFrame(loop);
}
setTimeout(kickLoop, 0);
window.addEventListener("load", kickLoop);

/* ── SETTINGS (Chaosverb set: tooltips, window size presets, brightness) ── */
const settingsPopover = document.getElementById("settingsPopover");
document.getElementById("buildInfo").textContent = "V0.1.0 · " + ENTROPAN_BUILD + (EMBEDDED ? " · plugin" : " · browser");
document.getElementById("settingsBtn").addEventListener("click", e => {
  settingsPopover.classList.toggle("open");
  e.stopPropagation();
});
document.addEventListener("mousedown", e => {
  if (settingsPopover.classList.contains("open")
      && !settingsPopover.contains(e.target)
      && e.target.id !== "settingsBtn")
    settingsPopover.classList.remove("open");
});

const settings = (() => {
  try { return JSON.parse(localStorage.getItem("entropanSettings") || "{}"); } catch { return {}; }
})();
function saveSettings() { try { localStorage.setItem("entropanSettings", JSON.stringify(settings)); } catch {} }

/* brightness */
let brightness = clamp(settings.brightness ?? 100, 70, 130);
const brightnessValue = document.getElementById("brightnessValue");
function applyBrightness() {
  shellEl.style.filter = brightness === 100 ? "" : `brightness(${brightness}%)`;
  brightnessValue.textContent = brightness + "%";
  settings.brightness = brightness; saveSettings();
}
document.getElementById("brightnessUp").addEventListener("click", () => { brightness = clamp(brightness + 5, 70, 130); applyBrightness(); });
document.getElementById("brightnessDown").addEventListener("click", () => { brightness = clamp(brightness - 5, 70, 130); applyBrightness(); });
applyBrightness();

/* window size presets → native editor resize */
document.querySelectorAll(".settings-preset-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    if (EMBEDDED) setEditorSizeNative(parseInt(btn.dataset.w), parseInt(btn.dataset.h)).catch(() => {});
  });
});

/* tooltips: custom floating div (WKWebView doesn't render native title) */
let tooltipsEnabled = settings.tooltips !== false;
const tooltipsToggle = document.getElementById("tooltipsToggle");
function applyTooltipsToggle() {
  tooltipsToggle.classList.toggle("on", tooltipsEnabled);
  settings.tooltips = tooltipsEnabled; saveSettings();
}
tooltipsToggle.addEventListener("click", () => { tooltipsEnabled = !tooltipsEnabled; applyTooltipsToggle(); });
applyTooltipsToggle();

const tipEl = document.createElement("div");
tipEl.className = "ui-tooltip";
document.body.appendChild(tipEl);
/* move titles to data-tip once (kills the broken native path) */
document.querySelectorAll("[title]").forEach(el => {
  el.dataset.tip = el.getAttribute("title");
  el.removeAttribute("title");
});
document.addEventListener("mouseover", e => {
  const t = e.target.closest("[data-tip]");
  if (!t || !tooltipsEnabled) { tipEl.classList.remove("visible"); return; }
  tipEl.textContent = t.dataset.tip;
  const r = t.getBoundingClientRect();
  tipEl.style.left = Math.min(Math.max(4, r.left + r.width / 2 - 60), document.documentElement.clientWidth - 130) + "px";
  tipEl.style.top = Math.max(4, r.top - 26) + "px";
  tipEl.classList.add("visible");
});
document.addEventListener("mouseout", () => tipEl.classList.remove("visible"));

/* ── corner resize grip → native setEditorSize (AU hosts lack edge resize) ── */
const setEditorSizeNative = native("setEditorSize");
(() => {
  const grip = document.getElementById("resizeGrip");
  let drag = null;
  grip.addEventListener("mousedown", e => {
    drag = { x: e.screenX, y: e.screenY,
             w: document.documentElement.clientWidth,
             h: document.documentElement.clientHeight };
    e.preventDefault(); e.stopPropagation();
  });
  window.addEventListener("mousemove", e => {
    if (!drag) return;
    const dw = e.screenX - drag.x;
    let w = clamp(drag.w + dw, 720, 1620);
    let h = Math.round(w * 560 / 900);          // aspect-locked
    if (EMBEDDED) setEditorSizeNative(Math.round(w), h).catch(() => {});
  });
  window.addEventListener("mouseup", () => drag = null);
})();

/* debug/testing handle — browser-only (never exposed inside the plugin) */
if (!EMBEDDED)
  window.__entropan = { version: ENTROPAN_BUILD, P, ui, spec, quickMenu, refreshPanels, drawScope, drawSpectrum, loopInfo: () => ({ lastFrame, simClock, loopCalls, loopErr, loopStarted }), kickLoop };
</script>
</body>
</html>
